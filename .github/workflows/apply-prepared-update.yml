name: Apply prepared site update

on:
  push:
    branches:
      - complete-booking-zelle
    paths:
      - davtian-site-update.tgz

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the prepared branch
        uses: actions/checkout@v4
        with:
          ref: complete-booking-zelle

      - name: Replace the branch with the tested site files
        run: |
          tar -xzf davtian-site-update.tgz
          rm -f davtian-site-update.tgz
          rm -f .github/workflows/apply-prepared-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify booking page and complete site workflow"
          git push origin complete-booking-zelle
